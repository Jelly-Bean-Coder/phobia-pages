{% extends "index.html" %}
{% block main_class %}{% endblock %}
{% block content %}
<button id="bookmark-star" onclick="bookmark( {{ phobia.id }} )" class="btn btn-outline-warning">&star;</button>
<h1>{{ phobia.name }}</h1>
<h3>{{ phobia.type }}</h3>
<p>{{ phobia.description }}</p>
<p>{{ phobia.summary }}</p>
<p>{{ phobia.symptoms }}</p>
<p>{{ phobia.definition }}</p>
{% endblock %}
