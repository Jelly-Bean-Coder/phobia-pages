{% extends "base.html" %}
{% block main_class %}{% endblock %}
{% block content %}
<button id="bookmark-star" onclick="bookmark( {{ phobia.id }} )" class="btn btn-outline-warning">&star;</button>
<div style="display: flex; justify-content: center; align-items: center">
    <h1 id="phobia-header">{{ phobia.name }}<span id="phobia-type" class="badge bg-primary">{{ phobia.type | upper }}</span></h1>

</div>

<p>{{ phobia.description }}</p>
<p>{{ phobia.summary }}</p>
<p>{{ phobia.symptoms }}</p>
<p>{{ phobia.definition }}</p>
{% endblock %}
