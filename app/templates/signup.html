{% extends "index.html" %}
{% block content %}
    <form method="POST" action="{{ url_for('auth.signup') }}" class="form-control">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" id="username" name="username" placeholder="Username" required>
        <label for="username">Username</label>

        <input type="email" id="email" name="email" placeholder="Email" required>
        <label for="email">Email</label>

        <input type="password" id="password" name="password" placeholder="Password" required>
        <label for="password">Password</label>

        <input type="password" id="check_password" name="check_password" placeholder="Confirm Password" required>
        <label for="check_password">Confirm Password</label>

        <button type="submit">Sign Up</button>
    </form>
{% endblock %}
