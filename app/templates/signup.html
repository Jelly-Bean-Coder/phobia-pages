{% extends "index.html" %}
{% block content %}
<div class="container centered-div">
    <div id="tmp" class="row align-items-center justify-content-center">
        <div class="col-md-8 col-lg-6">

            <form method="POST" action="{{ url_for('auth.signup') }}">
                <div class="mb-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                    <label for="username">Username</label>
                </div>

                <div class="mb-3">
                <input type="email" id="email" name="email" placeholder="Email" required>
                <label for="email">Email</label>

                <input type="password" id="password" name="password" placeholder="Password" required>
                <label for="password">Password</label>

                <input type="password" id="check_password" name="check_password" placeholder="Confirm Password" required>
                <label for="check_password">Confirm Password</label>

                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
