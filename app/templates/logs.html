{% extends "base.html" %}
{% block main_class %}{% endblock %}
{% block content %}
<button class="btn btn-outline-primary btn-md" data-bs-toggle="modal" data-bs-target="#logModal">&plus;</button>

<div class="modal" id="logModal" tabindex="-1" aria-labelledby="logModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Add Log</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form method="POST" action="{{ url_for('views.create_log') }}">
                    <input type="hidden" value="{{ csrf_token() }}" name="csrf_token">

                    <div class="mb-3">
                        <label for="phobia_id" class="form-label">Phobia Name</label>
                        <select id="phobia_id" name="phobia" class="form-control">
                             <option value="" disabled selected hidden>Please choose a phobia...</option>
                            {% for phobia in phobias %}
                                <option value="{{ phobia.id }}">{{ phobia.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="trigger" class="form-label">Trigger</label>
                        <input type="text" name="trigger" class="form-control" id="trigger" placeholder="Enter trigger">
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="severity" class="form-label">Severity</label>
                        <input type="range" id="severity" name="severity" min="1" max="10" class="form-range">
                    </div>

                    <div class="modal-footer px-0 pb-0">
                        <button type="button" class="btn btn-secondary" data-bs-shadow data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Log</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<div class="col-md-12">
    {% for log in logs %}
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ log.phobia.name }}</h5>
                <p class="card-text">Trigger: {{ log.trigger }}</p>
                <p class="card-text">Notes: {{ log.notes }}</p>
                <p class="card-text">Severity: {{ log.severity }}</p>
                <p class="card-text">Created at: {{ log.created_at }}</p>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
