{% extends "index.html" %}
{% block content %}
<form action="{{ url_for('views.after_search') }}" id="search-form" method="POST">
    <input type="text" name="phobia">
    <div class="dropdown">
        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
            Select Tags
        </button>

        <div class="dropdown-menu">
                {% for tag in all_tags %}
                    {% if tag.name %}
                        <label class="dropdown-item">
                            <input type="checkbox" name="tags" value="{{ tag.name }}">
                            {{ tag.name }}
                        </label>
                    {% endif %}
                {% endfor %}
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Search</button>
</form>
<button onclick="window.location.href='{{ url_for('auth.signup') }}'">Login</button>
{% endblock %}
