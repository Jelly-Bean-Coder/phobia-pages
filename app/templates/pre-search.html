{% extends "index.html" %}
{% block content %}
<form action="{{ url_for('views.after_search') }}" class="form-control" method="POST">
    <input type="text" name="phobia">
    <select name="tag">
            {% for tag in all_tags %}
                {% if tag.name %}
                    <option value="{{ tag.name }}">{{ tag.name }}</option>
                {% endif %}
            {% endfor %}
    </select>
    <button type="submit" class="btn btn-primary">Search</button>
</form>
{% endblock %}
