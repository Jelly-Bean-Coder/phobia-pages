<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phobia Pages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
          <!-- Added position-absolute, top-0, start-50, translate-middle-x, w-50, and z-3 -->
          <div class="alert alert-{{ category if category in ['success', 'danger', 'warning', 'info', 'secondary'] else 'primary' }} alert-dismissible fade show position-absolute top-0 start-50 translate-middle-x w-100 z-3 mt-3" role="alert" style="z-index: 1050;">
            {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
    {% endif %}
{% endwith %}


    <header>
        <h1 id="website-title" class="text-white">Phobia Pages</h1>
    </header>

    <main class="{% block main_class %}flex-grow-1 d-flex align-items-center justify-content-center{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='javascript/scripts.js') }}"></script>
</body>
</html>
