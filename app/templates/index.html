<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phobia Pages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

</head>
<body>
    <header>
        <h1 id="website-title">Phobia Pages</h1>
    </header>
    <div style="align-items: center;">
        <h3 id="phobia-title">{% block title %}Arachnophobia{% endblock %}</h3>
        <br>
        <h4 id="phobia-fear-of">{% block fear_of %}Spiders{% endblock %}</h4>
        <br>
        <h6 id="phobia-tags">{% block tags %}Spiders, arachnids, eight legs{% endblock %}</h6>
    </div>
</body>
</html>
